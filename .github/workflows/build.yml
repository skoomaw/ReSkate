name: Build

# Builds ReSkate (ReSkate.dll, the launcher and the server) on Windows and keeps the Release
# output as a downloadable artifact on the run's page.
#
# Caches, so a build only compiles what changed:
# - C and C++: sccache, kept in GitHub's Actions cache. Each object it compiles is stored as it
#   goes, and any later build (any branch) takes it back instead of compiling it again. That needs
#   Ninja (not the Visual Studio generator) and DINGOSDK_OBJECT_DEBUG_INFO (/Z7, which sccache can
#   keep; /Zi it cannot).
# - Rust (SpotifyHelper): cargo's downloads and its target folder, saved again whenever they change.
on:
  push:
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      # Restored from the newest cache with the same Cargo.lock (or any, failing that), and saved
      # under this run's own key, so it follows every change.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SpotifyHelper/target
          key: cargo-${{ runner.os }}-${{ hashFiles('SpotifyHelper/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('SpotifyHelper/Cargo.lock') }}-
            cargo-${{ runner.os }}-

      # CMake links an import library cargo downloads with the crates (cmake/Runtime.cmake), so they
      # are fetched before configuring.
      - name: Fetch crates
        working-directory: SpotifyHelper
        run: cargo fetch --locked

      - name: Configure
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DDINGOSDK_OBJECT_DEBUG_INFO=ON

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Cache statistics
        if: always()
        run: sccache --show-stats

      - name: Collect
        shell: pwsh
        run: |
          $out = "artifacts/ReSkate"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem build/ci -File |
            Where-Object { $_.Extension -in '.dll', '.exe' } |
            Copy-Item -Destination $out
          Get-ChildItem $out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ReSkate-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/ReSkate
          if-no-files-found: error
